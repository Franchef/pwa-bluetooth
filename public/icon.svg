<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowRing)" stroke-width="3" opacity="0.6"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.35"/>

  <!-- GPS crosshairs / Compass nodes -->
  <circle cx="256" cy="76" r="5" fill="#22D3EE" opacity="0.7"/>
  <circle cx="256" cy="436" r="5" fill="#22D3EE" opacity="0.7"/>
  <circle cx="76" cy="256" r="5" fill="#8B5CF6" opacity="0.7"/>
  <circle cx="436" cy="256" r="5" fill="#8B5CF6" opacity="0.7"/>

  <!-- Bluetooth Symbol with Glow -->
  <g filter="url(#neonGlow)">
    <path d="M 230,120 L 230,392 L 315,310 L 195,200 L 315,200 L 230,120 Z M 230,225 L 285,270 L 230,320 Z M 230,192 L 285,142 L 230,192 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Center pulse beacon -->
  <circle cx="256" cy="256" r="8" fill="#22D3EE"/>
</svg>
